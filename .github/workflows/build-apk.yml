name: Build Watch8 Hedge Odds Compact APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Watch8_HedgeOdds_v2_Compact_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build-watch8:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_DIR"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract uploaded source ZIP
        run: |
          test -f Watch8_HedgeOdds_v2_Compact_OneUpload.zip
          mkdir -p android-src
          unzip -q -o Watch8_HedgeOdds_v2_Compact_OneUpload.zip -d android-src
          test -f android-src/app/src/main/java/com/hthedge/watch8/MainActivity.java
          test -f android-src/app/src/main/java/com/hthedge/watch8/HedgeMath.java

      - name: Verify original odds algorithms
        run: |
          mkdir -p test-classes
          javac -d test-classes android-src/app/src/main/java/com/hthedge/watch8/HedgeMath.java android-src/tests/HedgeMathSmokeTest.java
          java -cp test-classes HedgeMathSmokeTest

      - name: Build installable Watch8 APK
        working-directory: android-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Watch8 install APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-HedgeOdds-v2-Compact-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
